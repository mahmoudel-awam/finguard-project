# FinGuard Infrastructure — v2.0 (First-Time-Right Edition)
# Fixes: Kafka listeners, Spark JARs, HBase isolation,
#        Hive+PostgreSQL metastore, Airflow executor, Networks

version: "3.8"

# ─────────────────────────────────────────
# SHARED NETWORK — كل الـ services تشوف بعض
# ─────────────────────────────────────────
networks:
  finguard-net:
    driver: bridge

volumes:
  airflow-db:
  hadoop_namenode:
  hadoop_datanode:
  hive-metastore-db:      # PostgreSQL data للـ Hive Metastore
  prometheus-data:
  postgres_data:

services:

  # ═══════════════════════════════════════
  # ZOOKEEPER
  # ═══════════════════════════════════════
  zookeeper:
    image: zookeeper:3.8
    container_name: finguard-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    networks:
      - finguard-net
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════
  # KAFKA — FIX: Listener names + broker config
  # ═══════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finguard-kafka
    hostname: kafka
    ports:
      - "9092:9092"       # internal (Spark/services داخل Docker)
      - "29092:29092"     # external (Producer بتاعك من host machine)
    environment:
      # FIX 1: Listener separation — الأهم في الملف كله
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL   # ← الـ FIX الحاسم

      # Zookeeper
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Performance & Reliability
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # FinGuard-specific: retention لـ 7 أيام (للـ DLQ replay)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

      # Auto-create topics (للـ dev فقط — نعطله في prod)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - finguard-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════
  # SCHEMA REGISTRY
  # ═══════════════════════════════════════
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: finguard-schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092   # INTERNAL listener
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - finguard-net

  # ═══════════════════════════════════════
  # SPARK — FIX: Custom image with all required JARs
  # ═══════════════════════════════════════

  # نبني image مخصصة بدل الـ vanilla
  # (الـ Dockerfile في الخطوة التالية)
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: finguard-spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      - SPARK_EXTRA_CLASSPATH=/opt/spark/extra-jars/*
    volumes:
      - ./spark-apps:/opt/spark/apps
      - ./spark-logs:/opt/spark/logs
      - ./checkpoints:/opt/spark/checkpoints
    networks:
      - finguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 20s
      retries: 3

  spark-worker:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: finguard-spark-worker
    hostname: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_EXTRA_CLASSPATH=/opt/spark/extra-jars/*
    volumes:
      - ./spark-apps:/opt/spark/apps
      - ./spark-logs:/opt/spark/logs
      - ./checkpoints:/opt/spark/checkpoints
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - finguard-net

  # ═══════════════════════════════════════
  # HDFS
  # ═══════════════════════════════════════
  namenode:
    image: apache/hadoop:3.3.6
    container_name: finguard-namenode
    hostname: namenode
    ports:
      - "9870:9870"   # NameNode UI
      - "8020:8020"   # RPC
    environment:
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:8020
      - HDFS-SITE.XML_dfs.namenode.rpc-address=namenode:8020
      - HDFS-SITE.XML_dfs.replication=1    # dev mode — واحد DataNode بس
      - HADOOP_HOME=/opt/hadoop
    command: >
      bash -c "
        if [ ! -d /hadoop/dfs/name/current ]; then
          /opt/hadoop/bin/hdfs namenode -format -force -nonInteractive;
        fi;
        /opt/hadoop/bin/hdfs namenode
      "
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    deploy:
      resources:
        limits:
          memory: 4g
    networks:
      - finguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      retries: 5

  datanode:
    image: apache/hadoop:3.3.6
    container_name: finguard-datanode
    hostname: datanode
    ports:
      - "9864:9864"
    environment:
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:8020
      - HDFS-SITE.XML_dfs.datanode.address=datanode:9866
      - HADOOP_HOME=/opt/hadoop
    command: /opt/hadoop/bin/hdfs datanode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - finguard-net

  # ═══════════════════════════════════════
  # HBASE — FIX: Isolated على port مختلف
  # ═══════════════════════════════════════
  hbase:
    image: harisekhon/hbase:1.4
    container_name: finguard-hbase
    hostname: hbase
    ports:
      - "16000:16000"   # HMaster
      - "16010:16010"   # HMaster Web UI
      - "16020:16020"   # RegionServer
      - "16030:16030"   # RegionServer Web UI
      - "9090:9090"     # Thrift Server (Spark بيتكلم معاه)
      - "9095:9095"     # Thrift UI
      # FIX: HBase Zookeeper على port مختلف عن الـ external ZK
      - "2182:2181"     # نعرض ZK الداخلي على 2182 عشان مفيش conflict
    environment:
      # نقوله يستخدم Zookeeper الداخلي بتاعه — مش بتاعنا
      HBASE_CONF_hbase_zookeeper_quorum: localhost
      HBASE_CONF_hbase_zookeeper_property_clientPort: 2181
    deploy:
      resources:
        limits:
          memory: 2g    # زودنا من 1g — HBase بيحتاج أكتر
    networks:
      - finguard-net

  # ═══════════════════════════════════════
  # HIVE METASTORE DATABASE — FIX: PostgreSQL بدل Derby
  # ═══════════════════════════════════════
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: finguard-hive-metastore-db
    hostname: hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_secure_2026
    volumes:
      - hive-metastore-db:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - finguard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      retries: 5

  # ═══════════════════════════════════════
  # HIVE — FIX: PostgreSQL metastore
  # ═══════════════════════════════════════
  hive:
    image: apache/hive:3.1.3
    container_name: finguard-hive
    hostname: hive
    ports:
      - "10000:10000"   # HiveServer2 JDBC
      - "10002:10002"   # HiveServer2 Web UI
    environment:
      - SERVICE_NAME=hiveserver2
      # FIX: PostgreSQL بدل Derby
      - HIVE_METASTORE_DB_TYPE=postgres
      - HIVE_METASTORE_DB_HOSTNAME=hive-metastore-db
      - HIVE_METASTORE_DB_PORT=5432
      - HIVE_METASTORE_DB_NAME=metastore
      - HIVE_METASTORE_DB_USERNAME=hive
      - HIVE_METASTORE_DB_PASSWORD=hive_secure_2026
      # HDFS integration
      - HIVE_CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - finguard-net

  # ═══════════════════════════════════════
  # AIRFLOW — FIX: LocalExecutor + proper init
  # ═══════════════════════════════════════
  airflow:
    image: apache/airflow:2.8.1-python3.11
    container_name: finguard-airflow
    hostname: airflow
    ports:
      - "8088:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      # ✅ واحدة بس — PostgreSQL
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_CONN_POSTGRES_DEFAULT=postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=finguard_airflow_secret_2026
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
    depends_on:
      postgres:               # ✅ لازم يستنى الـ DB
        condition: service_healthy
    volumes:
      - airflow-db:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./spark-apps:/opt/airflow/spark-apps
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --firstname FinGuard
          --lastname Admin
          --role Admin
          --email admin@finguard.com
          --password FinGuard@2026 || true &&
        airflow scheduler &
        exec airflow webserver
      "
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - finguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════
  # PROMETHEUS — FIX: config flag + persistence
  # ═══════════════════════════════════════
  # prometheus:
  #   image: prom/prometheus:v2.50.0   # pinned version — مش latest
  #   container_name: finguard-prometheus
  #   hostname: prometheus
  #   ports:
  #     - "9091:9090"
  #   # FIX: نقوله صراحةً يستخدم الـ config file
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--storage.tsdb.path=/prometheus"
  #     - "--storage.tsdb.retention.time=30d"   # 30 يوم retention
  #     - "--web.enable-lifecycle"               # hot-reload بدون restart
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512m
  #   networks:
  #     - finguard-net

#============================================
#postgrsql
#============================================
  postgres:
    image: postgres:15
    container_name: finguard-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finguard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s